services:
  db:
    image: mariadb:10.6
    container_name: wordpress_db
    restart: always
    env_file: .env
    # Les mots de passe sont lus depuis des fichiers (Docker secrets), pas depuis l'env
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_root_password
      - db_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wp_network

  wordpress:
    image: wordpress:latest
    container_name: wordpress_app
    restart: always
    depends_on:
      - db
    env_file: .env
    environment:
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      # Derriere le reverse-proxy nginx (TLS), on indique a WordPress qu'on est en HTTPS
      # sinon boucle de redirection quand siteurl est en https://
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    secrets:
      - db_password
    volumes:
      - wp_data:/var/www/html
    networks:
      - wp_network

  # Outil one-shot pour installer WordPress (wp-cli). Ne demarre PAS avec 'up'
  # (profile tools) : il est lance a la demande par le role ansible "wordpress".
  wpcli:
    image: wordpress:cli
    container_name: wordpress_cli
    depends_on:
      - db
      - wordpress
    env_file: .env
    environment:
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - wp_data:/var/www/html
    networks:
      - wp_network
    profiles:
      - tools

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: wordpress_pma
    restart: always
    depends_on:
      - db
    # Pas de PMA_USER/PMA_PASSWORD : l'utilisateur s'authentifie avec ses identifiants
    # DB sur la page de login (aucun secret dans l'environnement du conteneur)
    environment:
      PMA_HOST: db
      PMA_ABSOLUTE_URI: https://${DOMAIN_NAME:-localhost}/phpmyadmin/
    networks:
      - wp_network

  nginx:
    image: nginx:alpine
    container_name: wordpress_nginx
    restart: always
    ports:
      - "80:80" #http (redirect)
      - "443:443" #https (TLS)
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs
      - /etc/letsencrypt:/etc/letsencrypt:ro  # certificats Let's Encrypt (lecture seule)
    depends_on:
      - wordpress
      - phpmyadmin
    networks:
      - wp_network

volumes:
  db_data:
  wp_data:

networks:
  wp_network:

secrets:
  db_root_password:
    file: ./secrets/db_root_password
  db_password:
    file: ./secrets/db_password
