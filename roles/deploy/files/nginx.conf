server {
    listen 80;
    server_name _;

    #redirect auto http -> https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    #certificat ssl
    ssl_certificate /etc/nginx/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # DNS interne Docker : force une resolution dynamique des noms de service
    # (evite qu'une IP de conteneur recree reste en cache dans nginx)
    resolver 127.0.0.11 valid=10s;

    #route wp
    location / {
        set $upstream_wordpress wordpress;
        proxy_pass http://$upstream_wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    #route phpMyAdmin
    location /phpmyadmin/ {
        set $upstream_pma phpmyadmin;
        proxy_pass http://$upstream_pma:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}