---
# Variables NON sensibles (versionnees dans git)

# Chemin de deploiement sur le serveur cible
project_path: /home/ubuntu/inception

# Configuration base de donnees (le nom d'utilisateur/base n'est pas un secret)
mysql_database: wordpress
mysql_user: apintus

# Nom de domaine du site (DuckDNS recommande, gratuit).
# Doit pointer vers l'IP publique (Elastic IP) du serveur.
# Laisse vide -> l'IP publique est utilisee (uniquement valable en mode selfsigned).
# Exemple : "moncloud.duckdns.org"
domain_name: ""

# Mode TLS :
#   'letsencrypt' -> vrai certificat (necessite domain_name + port 80 joignable)
#   'selfsigned'  -> certificat auto-signe (pour tester sans domaine)
tls_mode: selfsigned

# Email de contact Let's Encrypt (notifications d'expiration). Non sensible.
letsencrypt_email: "alesshardy22@gmail.com"

# Installation automatique du site WordPress (non sensibles)
# Le mot de passe admin est dans le vault (wp_admin_password)
wp_title: "Cloud-1"
wp_admin_user: "admincloud1"
wp_admin_email: "alesshardy22@gmail.com"
