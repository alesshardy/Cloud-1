---
- name: Deploy Cloud-1 on AWS
  hosts: webservers        # cible definie dans inventory.ini
  become: yes              # execute les commandes en sudo (root)

  # Les variables viennent de group_vars/all/ (vars.yml + vault.yml)
  roles:
    - { role: common, tags: ['common', 'base'] }   # prepa serveur (apt, dossiers)
    - { role: docker, tags: ['docker'] }            # moteur Docker
    - { role: certs,  tags: ['certs', 'tls'] }      # certificat TLS auto-signe
    - { role: deploy, tags: ['deploy', 'app'] }     # fichiers + lancement de la stack
